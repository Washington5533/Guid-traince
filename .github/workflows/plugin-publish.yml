# DSH community plugin publish pipeline (see docs/PLUGIN_STANDARDS.md §8).
#
# Trigger: `git tag vX.Y.Z` (must match package.json version) or manual run.
# Pipeline: validate → test + build → publish npm → update registry → release.

name: Publish Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PLUGIN_DIR: dsh-plugin/dsh-client-ui-training-guardian

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version pinned explicitly: the action resolves `packageManager` from
      # the job working directory (repo root), where no package.json exists —
      # the plugin's lives in $PLUGIN_DIR. Keep in sync with its packageManager.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dsh-plugin/dsh-client-ui-training-guardian/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd "$PLUGIN_DIR"
          pnpm install

      - name: Validate against PLUGIN_STANDARDS
        run: python3 scripts/dsh_plugin_cli.py validate --plugin-dir "$PLUGIN_DIR"

      - name: Tag/version consistency check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd "$PLUGIN_DIR"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION != package.json $PKG_VERSION"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dsh-plugin/dsh-client-ui-training-guardian/pnpm-lock.yaml

      - name: Install
        run: |
          cd "$PLUGIN_DIR"
          pnpm install

      - name: Type check
        run: |
          cd "$PLUGIN_DIR"
          pnpm typecheck

      - name: Run tests
        run: |
          cd "$PLUGIN_DIR"
          pnpm test

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dsh-plugin/dsh-client-ui-training-guardian/pnpm-lock.yaml

      - name: Install
        run: |
          cd "$PLUGIN_DIR"
          pnpm install

      - name: Build
        run: |
          cd "$PLUGIN_DIR"
          pnpm build

      - name: Verify build artifacts (PLUGIN_STANDARDS §6)
        run: |
          cd "$PLUGIN_DIR"
          test -f dist/index.mjs || { echo "ERROR: dist/index.mjs missing"; exit 1; }
          test -f dist-client/client/index.js || { echo "ERROR: dist-client/client/index.js missing"; exit 1; }
          grep -q "__ModuleLoader__.load" dist-client/client/index.js \
            || { echo "ERROR: client bundle missing __ModuleLoader__ wrapper"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: |
            ${{ env.PLUGIN_DIR }}/dist/
            ${{ env.PLUGIN_DIR }}/dist-client/
          retention-days: 30

  publish-npm:
    runs-on: ubuntu-latest
    needs: [validate, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dsh-plugin/dsh-client-ui-training-guardian/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: |
          cd "$PLUGIN_DIR"
          pnpm install

      - name: Build
        run: |
          cd "$PLUGIN_DIR"
          pnpm build

      - name: Publish to npm
        run: |
          cd "$PLUGIN_DIR"
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-registry:
    runs-on: ubuntu-latest
    needs: publish-npm
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Update registry
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyyaml
          /tmp/venv/bin/python scripts/update_registry.py \
            --plugin-dir "$PLUGIN_DIR" \
            --registry registry/plugins.json \
            --registry-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/registry/plugins.json" \
            --source-url "${{ github.server_url }}/${{ github.repository }}/tree/${{ github.event.repository.default_branch }}/${{ env.PLUGIN_DIR }}" \
            --write

      - name: Commit updated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/plugins.json
          git diff --cached --quiet || git commit -m "chore(registry): update plugin list [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

  github-release:
    runs-on: ubuntu-latest
    needs: publish-npm
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
