<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<style>
/* ===== GitHub-Inspired Theme ===== */
:root {
  --color-bg-canvas: #ffffff;
  --color-bg-secondary: #f6f8fa;
  --color-bg-tertiary: #f3f4f6;
  --color-bg-elevated: #ffffff;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-text-primary: #1f2328;
  --color-text-secondary: #656d76;
  --color-text-tertiary: #8b949e;
  --color-text-link: #0969da;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: #ddf4ff;
  --color-success-fg: #1a7f37;
  --color-success-subtle: #dafbe1;
  --color-warning-fg: #9a6700;
  --color-warning-subtle: #fff8c5;
  --color-danger-fg: #cf222e;
  --color-danger-subtle: #ffebe9;
  --color-purple: #8250df;
  --color-teal: #0969da;
  --chart-palette: #0969da, #cf222e, #1a7f37, #9a6700, #8250df;
  --radius: 6px;
  --radius-sm: 4px;
  --shadow-sm: 0 1px 0 rgba(31,35,40,0.04);
  --shadow-md: 0 3px 6px rgba(140,149,159,0.15);
  --transition: 0.15s ease;
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
}

/* ===== Keyframe Animations ===== */
@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(26,127,55,0.4); } 70% { box-shadow: 0 0 0 6px rgba(26,127,55,0); } 100% { box-shadow: 0 0 0 0 rgba(26,127,55,0); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes toastSlideIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ===== Reset ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
  background: var(--color-bg-canvas);
  color: var(--color-text-primary);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--color-text-link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ===== Header ===== */
.site-header {
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--color-border-default);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}
.site-header__title {
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  color: var(--color-text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.ws-indicator {
  font-size: 11px;
  color: var(--color-text-secondary);
  display: flex;
  align-items: center;
  gap: 5px;
}
.ws-indicator__dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--color-warning-fg);
  transition: background var(--transition);
}
.ws-indicator__dot--connected { background: var(--color-success-fg); }
.ws-indicator__dot--disconnected { background: var(--color-danger-fg); }

.conn-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 999;
  background: var(--color-warning-subtle);
  color: var(--color-warning-fg);
  text-align: center;
  padding: 6px 16px;
  font-size: 12px; font-weight: 600;
  border-bottom: 1px solid rgba(154,103,0,0.3);
  display: none;
}
.conn-banner--show { display: block; }

.global-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 2em;
  background: var(--color-accent-subtle);
  color: var(--color-accent-fg);
  border: 1px solid rgba(9,105,218,0.2);
  display: none;
}

/* ===== Layout ===== */
.main-content { max-width: 1280px; margin: 0 auto; padding: 24px; }
.view { display: none; }
.view.active { display: block; animation: fadeSlideIn .3s ease-out; }

/* ===== Card ===== */
.card {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  transition: transform .2s ease, box-shadow .2s ease;
}
.card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.card__title {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-primary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

/* ===== Buttons ===== */
.btn {
  padding: 5px 12px;
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius);
  background: var(--color-bg-secondary);
  color: var(--color-text-primary);
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  display: inline-flex; align-items: center; gap: 4px;
  font-family: inherit; white-space: nowrap;
}
.btn:hover { background: #eaeef2; }
.btn:active { transform: scale(0.96); }
.btn--primary { background: var(--color-accent-fg); color: #fff; border-color: var(--color-accent-fg); }
.btn--primary:hover { background: #0860ca; }
.btn--danger { border-color: var(--color-danger-fg); color: var(--color-danger-fg); }
.btn--danger:hover { background: var(--color-danger-subtle); }
.btn--sm { padding: 3px 8px; font-size: 11px; }
.btn--active { background: var(--color-accent-fg) !important; color: #fff !important; border-color: var(--color-accent-fg) !important; }

/* ===== Process Grid ===== */
.process-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.process-card { cursor: pointer; transition: all var(--transition); animation: fadeSlideIn .35s ease-out both; animation-delay: calc(var(--i, 0) * 60ms); }
.process-card:hover { border-color: var(--color-accent-fg); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.process-card__name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.process-card__status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.process-card__status-dot--running { background: var(--color-success-fg); animation: pulse 2s ease-in-out infinite; }
.process-card__status-dot--failed { background: var(--color-danger-fg); }
.process-card__status-dot--completed { background: var(--color-accent-fg); }
.process-card__status-label {
  font-size: 11px; color: var(--color-text-secondary); font-weight: 500;
  padding: 1px 6px; border-radius: 2em;
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border-muted);
}
.process-card__meta { font-size: 12px; color: var(--color-text-secondary); margin: 6px 0; }
.progress-track { height: 4px; background: var(--color-bg-tertiary); border-radius: 4px; margin: 10px 0; overflow: hidden; }
.progress-track__bar {
  height: 100%;
  border-radius: 4px;
  transition: width .4s;
  background: repeating-linear-gradient(
    -45deg,
    var(--color-accent-fg), var(--color-accent-fg) 8px,
    rgba(9,105,218,0.6) 8px, rgba(9,105,218,0.6) 16px
  );
  background-size: 200% 100%;
  animation: shimmer 2.5s linear infinite;
}
.process-card__stats { display: flex; gap: 14px; font-size: 12px; flex-wrap: wrap; }
.stat-item__value { font-weight: 600; color: var(--color-text-primary); }
.stat-item__label { color: var(--color-text-secondary); margin-left: 3px; }
.process-card__actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-border-muted); }
.process-card__anomaly { color: var(--color-warning-fg); font-size: 12px; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ===== Metrics Row ===== */
.metrics-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 16px; }
.metric-card { background: var(--color-bg-elevated); border: 1px solid var(--color-border-default); border-radius: var(--radius); padding: 12px; text-align: center; border-top: 2px solid var(--color-border-muted); transition: transform .2s ease, box-shadow .2s ease; }
.metric-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.metric-card--loss { border-top-color: var(--color-danger-fg); }
.metric-card--acc { border-top-color: var(--color-success-fg); }
.metric-card--lr { border-top-color: var(--color-accent-fg); }
.metric-card--gpu { border-top-color: var(--color-purple); }
.metric-card--info { border-top-color: var(--color-border-default); }
.metric-card__value { font-size: 20px; font-weight: 700; color: var(--color-text-primary); }
.metric-card__label { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
.metric-card__trend { font-size: 11px; }
.metric-card__trend--up { color: var(--color-success-fg); }
.metric-card__trend--down { color: var(--color-danger-fg); }
.metric-card__trend--warn { color: var(--color-warning-fg); }

/* ===== Chart ===== */
.chart-container { width: 100%; height: 100%; border-radius: var(--radius); background: var(--color-bg-canvas); border: 1px solid var(--color-border-muted); }

/* Chart Grid (2-col compact / expand-on-click) */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  transition: gap .3s ease;
  padding: 0 0 4px;
}
.charts-grid.has-expanded { gap: 4px; }
.chart-wrapper {
  cursor: pointer;
  border-radius: var(--radius);
  transition: box-shadow .2s ease;
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.chart-wrapper .chart-container { overflow: hidden; position: relative; }
.chart-wrapper .chart-container .uplot { max-width: 100%; max-height: 100%; overflow: hidden; }
.chart-wrapper:hover { box-shadow: var(--shadow-md); }
.chart-wrapper.expanded {
  grid-column: 1 / -1;
}
.chart-wrapper .chart-group-title { padding: 6px 10px 2px; margin: 0; }
.chart-wrapper .chart-container { height: 240px; }
.chart-wrapper.expanded .chart-container { height: 400px; }
.charts-grid .chart-wrapper:last-child:nth-child(odd) {
  grid-column: 1 / -1;
}
@media (max-width: 640px) {
  .charts-grid { grid-template-columns: 1fr; }
  .chart-wrapper .chart-container { height: 220px; }
  .chart-wrapper.expanded .chart-container { height: 340px; }
}

.chart-group-title { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); margin: 8px 0 4px 2px; text-transform: uppercase; letter-spacing: .5px; }
.chart-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.chart-toolbar__left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chart-actions { display: flex; gap: 4px; }
.chart-controls__label { font-size: 13px; color: var(--color-text-secondary); }
.metric-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; color: var(--color-text-secondary); padding: 2px 6px; border-radius: 4px; }
.metric-toggle:hover { background: var(--color-bg-secondary); color: var(--color-text-primary); }
.metric-toggle input { accent-color: var(--color-accent-fg); }
.chart-range-wrap {
  position: relative; height: 30px; margin-bottom: 10px;
  background: var(--color-bg-secondary); border: 1px solid var(--color-border-muted);
  border-radius: var(--radius); padding: 0 10px; display: flex; align-items: center;
}
.chart-range-wrap input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; background: var(--color-border-muted); border-radius: 2px; outline: none; }
.chart-range-wrap input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--color-accent-fg); cursor: pointer; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.chart-range-label { font-size: 10px; color: var(--color-text-secondary); min-width: 28px; text-align: center; }

/* ===== Log Viewer ===== */
.log-toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.log-search { background: var(--color-bg-canvas); border: 1px solid var(--color-border-default); border-radius: var(--radius-sm); padding: 2px 8px; color: var(--color-text-primary); font-size: 11px; flex: none; font-family: inherit; outline: none; }
.log-search:focus { border-color: var(--color-accent-fg); box-shadow: 0 0 0 2px rgba(9,105,218,.15); }
.log-viewer { background: var(--color-bg-canvas); border: none; border-radius: 0; max-height: none; overflow-y: auto; font-family: var(--font-mono); font-size: 12px; scrollbar-width: thin; scrollbar-color: var(--color-border-muted) transparent; flex: 1; min-height: 0; }
.log-viewer::-webkit-scrollbar { width: 6px; }
.log-viewer::-webkit-scrollbar-track { background: transparent; }
.log-viewer::-webkit-scrollbar-thumb { background: var(--color-border-muted); border-radius: 3px; }
.log-line { padding: 2px 12px; white-space: pre-wrap; word-break: break-all; border-bottom: 1px solid #f0f0f0; line-height: 1.7; }
.log-line:hover { background: var(--color-bg-secondary); }
.log-line--error { color: var(--color-danger-fg); background: #fff0f0; }
.log-line--warning { color: var(--color-warning-fg); }

/* ===== Model Tree (Interactive Flowchart) ===== */
.model-tree { font-family: var(--font-mono); font-size: 12px; }
.model-tree__summary { margin-bottom: 12px; font-size: 12px; color: var(--color-text-secondary); display: flex; gap: 12px; flex-wrap: wrap; }
.model-tree__summary b { color: var(--color-text-primary); }
.model-tree ul { list-style: none; margin: 0; padding: 0; }
.model-tree ul.tree-children { padding-left: 24px; position: relative; overflow: hidden; transition: max-height .3s ease, opacity .25s ease; }
.model-tree ul.tree-children::before { content: ''; position: absolute; left: 9px; top: 0; bottom: 12px; width: 1px; background: var(--color-border-muted); }
.model-tree ul.tree-children.collapsed { max-height: 0 !important; opacity: 0; pointer-events: none; }
.model-tree ul.tree-children > li { position: relative; }
.model-tree ul.tree-children > li::before {
  content: ''; position: absolute; left: -15px; top: 17px; width: 14px; height: 0;
  border-bottom: 1px solid var(--color-border-muted);
}
.tree-node {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border: 1px solid var(--color-border-muted); border-radius: var(--radius-sm);
  background: var(--color-bg-elevated); margin: 3px 0;
  transition: all .15s ease; cursor: default; flex-wrap: wrap;
}
.tree-node:hover { border-color: var(--color-accent-fg); background: var(--color-accent-subtle); transform: scale(1.01); }
.tree-toggle {
  cursor: pointer; user-select: none; font-size: 10px; width: 16px; height: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 3px; transition: background .15s; flex-shrink: 0;
  color: var(--color-text-tertiary);
}
.tree-toggle:hover { background: var(--color-bg-secondary); }
.tree-spacer { width: 16px; flex-shrink: 0; }
.node-type-badge {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
  padding: 1px 5px; border-radius: 3px; flex-shrink: 0;
}
.node-type-badge--conv { background: #ddf4ff; color: #0969da; }
.node-type-badge--linear { background: #fbefff; color: #8250df; }
.node-type-badge--norm { background: #dafbe1; color: #1a7f37; }
.node-type-badge--pool { background: #fff8c5; color: #9a6700; }
.node-type-badge--act { background: #f3f4f6; color: #656d76; }
.node-type-badge--drop { background: #ffebe9; color: #cf222e; }
.node-type-badge--embed { background: #ddf4ff; color: #0550ae; }
.node-type-badge--default { background: var(--color-bg-secondary); color: var(--color-text-secondary); }
.node-name { font-weight: 500; color: var(--color-text-primary); }
.node-params-badge { font-size: 10px; color: var(--color-text-tertiary); }
.node-flops-badge { font-size: 10px; color: var(--color-warning-fg); }
.node-repeat-badge { font-size: 10px; font-weight: 600; color: var(--color-purple); }
.node-bar-track { display: inline-block; width: 60px; height: 4px; background: var(--color-bg-tertiary); border-radius: 2px; overflow: hidden; vertical-align: middle; }
.node-bar-fill { display: block; height: 100%; border-radius: 2px; transition: width .4s ease; }
.model-sub-active { background: var(--color-accent-fg) !important; color: #fff !important; border-color: var(--color-accent-fg) !important; }

/* ===== AI Panel ===== */
.ai-response { background: var(--color-bg-canvas); border: none; border-radius: 0; padding: 8px 0; font-size: 13px; line-height: 1.6; min-height: 40px; flex: 1; overflow-y: auto; white-space: pre-wrap; }
.ai-chat { display: flex; gap: 8px; flex-shrink: 0; padding-top: 8px; border-top: 1px solid var(--color-border-muted); }
.ai-chat__input { flex: 1; background: var(--color-bg-canvas); border: 1px solid var(--color-border-default); border-radius: var(--radius); padding: 8px 12px; color: var(--color-text-primary); font-size: 13px; font-family: inherit; outline: none; }
.ai-chat__input:focus { border-color: var(--color-accent-fg); box-shadow: 0 0 0 2px rgba(9,105,218,.15); }

/* ===== Gallery Grid ===== */
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.gallery-item { position: relative; background: var(--color-bg-elevated); border: 1px solid var(--color-border-default); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: all var(--transition); }
.gallery-item:hover { border-color: var(--color-accent-fg); box-shadow: var(--shadow-md); }
.gallery-item img { width: 100%; height: 120px; object-fit: cover; }
.gallery-item__placeholder { height: 120px; background: var(--color-bg-secondary); display: flex; align-items: center; justify-content: center; font-size: 28px; }
.gallery-item__info { padding: 6px 8px; font-size: 11px; }
.gallery-item__conf { font-weight: 600; color: var(--color-accent-fg); }
.gallery-item__label { color: var(--color-text-secondary); margin-left: 4px; }
.gallery-item--selected { border-color: var(--color-accent-fg); box-shadow: 0 0 0 2px rgba(9,105,218,.3); }

/* ===== Compare ===== */
.compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.compare-card__metric { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--color-border-muted); }
.compare-bar { display: none; align-items: center; gap: 8px; }
.compare-bar.active { display: flex; }

/* ===== Back Link ===== */
.back-link { font-size: 13px; color: var(--color-text-link); cursor: pointer; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 4px; }
.back-link:hover { text-decoration: underline; }

/* ===== Empty State ===== */
.empty-state { text-align: center; padding: 40px 20px; color: var(--color-text-secondary); font-size: 13px; }
.empty-state__icon { font-size: 36px; margin-bottom: 8px; display: block; opacity: .6; }
.empty-state__hint { font-size: 11px; margin-top: 6px; color: var(--color-text-tertiary); }

/* ===== Form ===== */
.new-guardian-form { display: flex; gap: 8px; margin-top: 12px; }
.new-guardian-form__input { flex: 1; background: var(--color-bg-canvas); border: 1px solid var(--color-border-default); border-radius: var(--radius); padding: 8px 12px; color: var(--color-text-primary); font-size: 13px; font-family: var(--font-mono); outline: none; }
.new-guardian-form__input:focus { border-color: var(--color-accent-fg); box-shadow: 0 0 0 2px rgba(9,105,218,.15); }
.new-guardian-form__label { font-size: 12px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 6px; }
.section-label { font-size: 12px; color: var(--color-text-secondary); }

/* ===== History ===== */
.history-card { opacity: .9; }
.history-card:hover { opacity: 1; }
.history-card__date { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }

/* ===== Workstation Layout ===== */
.workstation {
  display: grid;
  grid-template-columns: 1fr 380px;
  grid-template-rows: auto auto 1fr auto;
  gap: 12px;
  min-height: calc(100vh - 140px);
}
.workstation__header { grid-column: 1 / -1; }
.workstation__metrics { grid-column: 1 / -1; }
.workstation__left {
  grid-column: 1;
  display: flex; flex-direction: column; gap: 12px;
  min-width: 0;
}
.workstation__right {
  grid-column: 2;
  display: flex; flex-direction: column; gap: 12px;
  min-width: 0;
  max-height: calc(100vh - 200px);
  overflow: hidden;
}
.panel {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel--grow { flex: 1; min-height: 200px; }
.panel--fixed { height: 260px; flex-shrink: 0; }
.panel__titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--color-border-muted);
  background: var(--color-bg-secondary);
  font-size: 12px; font-weight: 600; color: var(--color-text-primary);
  flex-shrink: 0;
}
.panel__titlebar-actions { display: flex; gap: 4px; align-items: center; }
.panel__body { flex: 1; overflow: auto; padding: 12px; min-height: 0; display: flex; flex-direction: column; }
.panel__body--nopad { padding: 0; }

/* Cursor Info Panel */
.cursor-info { padding: 6px 10px; font-size: 11px; }
.cursor-info__step { font-weight: 600; color: var(--color-accent-fg); margin-bottom: 4px; font-size: 12px; }
.cursor-info__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
.cursor-info__item { display: flex; justify-content: space-between; align-items: baseline; padding: 1px 0; }
.cursor-info__key { color: var(--color-text-secondary); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cursor-info__val { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--color-text-primary); }
.cursor-info__val--empty { color: var(--color-text-tertiary); font-weight: 400; font-style: italic; }
.cursor-info__dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; flex-shrink: 0; }

/* Cursor Floating Tooltip */
.cursor-tooltip {
  position: fixed;
  pointer-events: none;
  z-index: 10000;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 8px 12px;
  font-size: 11px;
  display: none;
  max-width: 280px;
  backdrop-filter: blur(8px);
}
.cursor-tooltip.visible { display: block; }
.cursor-tooltip__step { font-weight: 600; color: var(--color-accent-fg); margin-bottom: 3px; font-size: 11px; }
.cursor-tooltip__row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 1px 0; }
.cursor-tooltip__key { color: var(--color-text-secondary); white-space: nowrap; }
.cursor-tooltip__val { font-family: var(--font-mono); font-weight: 600; color: var(--color-text-primary); white-space: nowrap; }

/* AI Status Indicator */
.ai-status {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--color-text-secondary);
}
.ai-status__dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--color-text-tertiary);
  transition: background .3s;
}
.ai-status__dot--ok { background: var(--color-success-fg); }
.ai-status__dot--fail { background: var(--color-danger-fg); }
.ai-status__dot--checking { background: var(--color-warning-fg); animation: pulse 1.5s ease-in-out infinite; }

/* Extra Tabs (Model / Gallery) */
.extra-tabs { grid-column: 1 / -1; }
.extra-tabs__bar {
  display: flex; align-items: center; gap: 0;
  border-bottom: 1px solid var(--color-border-default);
}
.extra-tab {
  padding: 6px 14px; font-size: 12px; cursor: pointer;
  color: var(--color-text-secondary);
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
}
.extra-tab:hover { color: var(--color-text-primary); }
.extra-tab.active { color: var(--color-text-primary); font-weight: 600; border-bottom-color: var(--color-accent-fg); }
.extra-panel { display: none; }
.extra-panel.active { display: block; }

/* ===== Responsive ===== */
@media (max-width: 900px) {
  .workstation { grid-template-columns: 1fr; }
  .workstation__left { grid-column: 1; }
  .workstation__right { grid-column: 1; max-height: none; }
}
@media (max-width: 640px) {
  .site-header { padding: 10px 14px; } .main-content { padding: 12px; }
  .process-grid { grid-template-columns: 1fr; } .metrics-row { grid-template-columns: repeat(2, 1fr); }
  .gallery-grid { grid-template-columns: repeat(2, 1fr); }
  .tab { padding: 6px 10px; font-size: 11px; } .card { padding: 12px; }
  .chart-container { height: 240px; } .new-guardian-form { flex-direction: column; }
  .compare-grid { grid-template-columns: 1fr; }
}
@media (min-width: 641px) and (max-width: 1024px) {
  .process-grid { grid-template-columns: repeat(2, 1fr); }
  .gallery-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 1025px) {
  .gallery-grid { grid-template-columns: repeat(6, 1fr); }
}

/* ===== Event Legend ===== */
.event-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--color-border-muted); }
.event-legend__item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--color-text-secondary); }
.event-legend__dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

/* ===== Skeleton Loading ===== */
.skeleton-line { height: 12px; border-radius: 4px; margin: 8px 0; background: linear-gradient(90deg, var(--color-bg-secondary) 25%, var(--color-bg-tertiary) 50%, var(--color-bg-secondary) 75%); background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite; }
.skeleton-line--short { width: 40%; }
.skeleton-line--medium { width: 65%; }
.skeleton-line--long { width: 85%; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--color-text-primary); color: #fff; padding: 8px 18px;
  border-radius: var(--radius); font-size: 13px; z-index: 1000;
  opacity: 0; transition: all .3s cubic-bezier(.4,0,.2,1); pointer-events: none;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}
.toast--show { opacity: 1; transform: translateX(-50%) translateY(0); animation: toastSlideIn .3s ease-out; }

/* ===== Global Scrollbar ===== */
* { scrollbar-width: thin; scrollbar-color: var(--color-border-muted) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--color-border-muted); border-radius: 3px; }
*::-webkit-scrollbar-thumb:hover { background: var(--color-text-tertiary); }
</style>

</head>
<body>
<div id="conn-banner" class="conn-banner">连接中断，正在重连...</div>
<header class="site-header">
  <div class="site-header__title" onclick="showProcessList()">Guardian Dashboard</div>
  <div class="site-header__status">
    <span class="ws-indicator" id="ws-status">
      <span class="ws-indicator__dot"></span>
      <span class="ws-indicator__text">连接中...</span>
    </span>
    <span id="global-badge" class="global-badge"></span>
  </div>
</header>

<main class="main-content">
<div id="toast" class="toast"></div>
  <!-- ========== Process List ========== -->
  <div id="view-process-list" class="view active">
    <div class="card">
      <div class="card__header">
        <div class="card__title">活跃进程</div>
        <button class="btn btn--sm" onclick="refreshProcesses()">刷新</button>
      </div>
      <div id="process-grid" class="process-grid"></div>
      <div style="margin-top:20px">
        <div class="new-guardian-form__label">新建守护</div>
        <div class="new-guardian-form">
          <input class="new-guardian-form__input" id="new-command" value="python train.py --epochs 20" placeholder="训练命令...">
          <button class="btn btn--primary" onclick="copyGuardianCmd()">启动</button>
        </div>
      </div>
    </div>
    <div id="compare-bar" class="card compare-bar">
      <span style="font-size:13px">已选: <b id="compare-count">0</b>/5</span>
      <button class="btn btn--primary btn--sm" onclick="runCompare()">开始对比</button>
      <button class="btn btn--sm" onclick="clearCompare()">清除</button>
    </div>
    <!-- History section -->
    <div class="card" id="history-section">
      <div class="card__header">
        <div class="card__title">历史进程</div>
      </div>
      <div id="history-grid" class="process-grid"></div>
    </div>
  </div>

  <!-- ========== Process Detail (Workstation) ========== -->
  <div id="view-process-detail" class="view">
    <div class="workstation">
      <!-- Header Row -->
      <div class="workstation__header">
        <div class="back-link" onclick="showProcessList()">&larr; 返回进程列表</div>
        <div id="detail-header" class="card" style="margin-bottom:0"></div>
      </div>

      <!-- Metrics Row -->
      <div class="workstation__metrics">
        <div id="detail-metrics" class="metrics-row"></div>
      </div>

      <!-- Left Column: Charts -->
      <div class="workstation__left">
        <div class="panel panel--grow">
          <div class="panel__titlebar">
            <span>训练曲线</span>
            <div class="panel__titlebar-actions">
              <button class="btn btn--sm" onclick="toggleSmoothing()" id="btn-ema">EMA</button>
              <button class="btn btn--sm" onclick="exportCSV()">CSV</button>
              <button class="btn btn--sm" onclick="exportPNG()">PNG</button>
              <button class="btn btn--sm" onclick="resetZoom()">Reset</button>
            </div>
          </div>
          <div class="panel__body panel__body--nopad">
            <div style="padding:8px 12px 0">
              <div class="chart-toolbar" style="margin-bottom:4px">
                <div class="chart-toolbar__left">
                  <span class="chart-controls__label">显示指标:</span>
                  <div id="metric-toggles"></div>
                </div>
              </div>
            </div>
            <div id="chart-panels" style="padding:0 12px"></div>
            <div style="padding:0 12px 8px">
              <div class="chart-range-wrap">
                <span class="chart-range-label" id="range-start">0</span>
                <input type="range" id="chart-range-min" min="0" max="100" value="0" oninput="onRangeChange()">
                <input type="range" id="chart-range-max" min="0" max="100" value="100" oninput="onRangeChange()">
                <span class="chart-range-label" id="range-end">100</span>
              </div>
              <div class="event-legend" id="event-legend"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Cursor Info + Logs + AI -->
      <div class="workstation__right">
        <!-- Cursor Info Panel -->
        <div class="panel" style="flex-shrink:0">
          <div class="panel__titlebar">
            <span>坐标信息</span>
            <span style="font-size:11px;color:var(--color-text-tertiary)" id="cursor-hint">悬停图表查看</span>
          </div>
          <div class="cursor-info" id="cursor-info">
            <div class="cursor-info__val cursor-info__val--empty">鼠标悬停图表以查看数据</div>
          </div>
        </div>
        <!-- Log Panel -->
        <div class="panel panel--grow">
          <div class="panel__titlebar">
            <span>日志</span>
            <div class="panel__titlebar-actions">
              <button class="btn btn--sm" onclick="toggleAutoScroll()" id="btn-autoscroll">暂停滚动</button>
              <button class="btn btn--sm" onclick="refreshLogs()">刷新</button>
            </div>
          </div>
          <div class="panel__body panel__body--nopad">
            <input class="log-search" placeholder="搜索日志..." oninput="filterLogs(this.value)" style="margin:3px 8px 2px;flex-shrink:0">
            <div id="log-viewer" class="log-viewer"></div>
          </div>

        <!-- AI Panel -->
        <div class="panel panel--fixed">
          <div class="panel__titlebar">
            <span>AI 分析</span>
            <div class="panel__titlebar-actions">
              <span class="ai-status" id="ai-status">
                <span class="ai-status__dot ai-status__dot--checking" id="ai-status-dot"></span>
                <span id="ai-status-text">检测中</span>
              </span>
              <button class="btn btn--primary btn--sm" onclick="runAIAnalysis()" id="btn-ai-analyze">分析</button>

            <div class="ai-chat">
              <input class="ai-chat__input" id="ai-question" placeholder="追问..." onkeydown="if(event.key==='Enter')askAI()">
              <button class="btn btn--sm" onclick="askAI()">发送</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Extra Tabs: Model / Gallery -->
      <div class="extra-tabs">
        <div class="extra-tabs__bar">
          <div class="extra-tab" data-extra-tab="model" onclick="switchExtraTab('model')">模型结构</div>
          <div class="extra-tab" data-extra-tab="gallery" onclick="switchExtraTab('gallery')">图库</div>
        </div>
        <div id="extra-panel-model" class="extra-panel">
          <div class="card" style="margin-top:12px">
            <div class="card__header">
              <div class="card__title">模型结构</div>
              <div style="display:flex;gap:6px;align-items:center">
                <button class="btn btn--sm" onclick="switchModelSubTab('tree')" id="btn-model-tree">树形</button>
                <button class="btn btn--sm" onclick="switchModelSubTab('viz')" id="btn-model-viz-tab">架构图</button>
                <button class="btn btn--primary btn--sm" onclick="generateModelVizInline()" id="btn-model-viz">生成</button>
              </div>

            <div id="model-sub-tree">
              <div id="model-tree" class="model-tree"></div>

              <button class="btn btn--primary btn--sm" onclick="generateGallery()" id="btn-gallery-gen">生成图库</button>
            </div>

  <!-- ========== Compare ========== -->

    <div class="back-link" onclick="showProcessList()">&larr; 返回进程列表</div>

      <div class="card__title">对比结果</div>

    </div>

</main>

<!-- Cursor Floating Tooltip (global, fixed position) -->
<div class="cursor-tooltip" id="cursor-tooltip"></div>

<script>
// ===================== State =====================
let currentProcessId = null;
let currentDetail = null;
let autoscroll = true;
let compareSet = new Set();
let wsGlobal = null;
let wsProcess = null;
let chartInstances = [];  // Array of uPlot instances (multi-view)
let smoothingEnabled = false;
let chartEvents = [];
let isHistoryProcess = false;  // Whether current detail is from history
let _dashConfig = null;        // Remote dashboard config (fetched on load)
let _dashDirty = new Set();    // Keys the user manually changed (protected from remote override)

// ===================== Theme Constants =====================
const THEME = {
  bg: '#ffffff',
  text: '#656d76',
  border: '#d0d7de',
  grid: 'rgba(208,215,222,0.4)',
  tooltip: { bg: '#ffffff', border: '#0969da' },
  palette: ['#0969da', '#cf222e', '#1a7f37', '#9a6700', '#8250df'],
};

// ===================== Init =====================
function _resizeCharts() {
  chartInstances.forEach(c => {
    const el = document.getElementById('chart-group-' + c._groupName);
    if (el && el.clientWidth > 0 && el.clientHeight > 0) {
      c.setSize({ width: el.clientWidth, height: el.clientHeight });
    }
  });
}
function init() {
  connectWS();
  refreshProcesses();
  window.addEventListener('resize', _resizeCharts);
}
document.addEventListener('DOMContentLoaded', init);

// ===================== WebSocket =====================
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws`;
  wsGlobal = new WebSocket(url);
  wsGlobal.onopen = () => {
    setWSStatus('● 已连接', true);
    document.getElementById('conn-banner').classList.remove('conn-banner--show');
  };
  wsGlobal.onclose = () => {
    setWSStatus('● 断开 · 3s 后重连', false);
    document.getElementById('conn-banner').classList.add('conn-banner--show');
    setTimeout(connectWS, 3000);
  };
  wsGlobal.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'process_update') refreshProcesses();
    if (msg.type === 'metrics' && currentProcessId === msg.process_id) liveUpdateMetrics(msg.data);
    if (msg.type === 'log_line' && currentProcessId === msg.process_id) liveLogLine(msg.line);
    if (msg.type === 'dashboard-config' && currentProcessId === msg.process_id) applyRemoteDashConfig(msg.data, msg.source);
  };
}

function setWSStatus(text, connected) {
  const el = document.getElementById('ws-status');
  const dot = el.querySelector('.ws-indicator__dot');
  el.querySelector('.ws-indicator__text').textContent = text;
  dot.className = 'ws-indicator__dot' + (connected ? ' ws-indicator__dot--connected' : ' ws-indicator__dot--disconnected');
}

function subProcessWS(pid) {
  if (wsProcess) { wsProcess.close(); wsProcess = null; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  wsProcess = new WebSocket(`${proto}://${location.host}/ws/process/${pid}`);
  wsProcess.onopen = () => {
    document.getElementById('conn-banner').classList.remove('conn-banner--show');
  };
  wsProcess.onclose = () => {
    document.getElementById('conn-banner').classList.add('conn-banner--show');
    setTimeout(() => { if (currentProcessId === pid) subProcessWS(pid); }, 3000);
  };
  wsProcess.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'metrics') liveUpdateMetrics(msg.data);
    if (msg.type === 'log_line') liveLogLine(msg.line);
    if (msg.type === 'state_patch') { if (currentDetail) Object.assign(currentDetail, msg.patch); }
    if (msg.type === 'dashboard-config') applyRemoteDashConfig(msg.data, msg.source);
  };
}

// ===================== API helpers =====================
async function api(url, timeoutMs = 10000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const r = await fetch(url, { signal: controller.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  } catch (err) {
    if (err.name === 'AbortError') console.warn(`[api] timeout: ${url}`);
    else console.warn(`[api] ${url}: ${err.message}`);
    return null;
  } finally {
    clearTimeout(timer);
  }
}

// ===================== Process List =====================
async function refreshProcesses() {
  const data = await api('/api/processes');
  if (!data) return;
  const grid = document.getElementById('process-grid');
  const histGrid = document.getElementById('history-grid');
  const procs = data.processes || [];
  const liveProcs = procs.filter(p => p.source === 'live');
  const histProcs = procs.filter(p => p.source === 'history');

  if (!liveProcs.length) {
    grid.innerHTML = `<div class="empty-state"><span class="empty-state__icon">&mdash;</span>暂无活跃进程<br><span class="empty-state__hint">在终端运行 python run.py watch --with-dashboard -- &lt;训练命令&gt;</span></div>`;
  } else {
    const badge = document.getElementById('global-badge');
    const runningCount = liveProcs.filter(p => p.status === 'running').length;
    badge.style.display = 'inline';
    badge.textContent = `${runningCount} running`;
    grid.innerHTML = liveProcs.map((p, i) => renderProcessCard(p, false, i)).join('');
  }

  // History section
  if (histProcs.length) {
    document.getElementById('history-section').style.display = '';
    histGrid.innerHTML = histProcs.map((p, i) => renderProcessCard(p, true, i)).join('');
  } else {
    document.getElementById('history-section').style.display = 'none';
  }
  updateCompareBar();
}

function renderProcessCard(p, isHistory, idx) {
  const epochStr = p.epoch ? `Epoch ${p.epoch}${p.max_epoch ? '/' + p.max_epoch : ''}` : '';
  const pct = p.max_epoch && p.epoch ? Math.round(p.epoch / p.max_epoch * 100) : 0;
  const m = p.latest_metrics || {};
  const g = p.latest_gpu || {};
  const checked = compareSet.has(p.process_id) ? 'checked' : '';
  const dotClass = p.status === 'running' ? 'process-card__status-dot--running' : p.status === 'failed' ? 'process-card__status-dot--failed' : 'process-card__status-dot--completed';
  const clickFn = isHistory ? `showHistoryDetail('${p.process_id}')` : `showDetail('${p.process_id}')`;
  const dateStr = p.created_at ? new Date(p.created_at * 1000).toLocaleDateString() : '';
  const extraClass = isHistory ? ' history-card' : '';
  const safeName = escapeHtml(p.name || p.process_id);
  const safeCmd = escapeHtml(p.command ? p.command.slice(0, 60) : '');
  return `<div class="card process-card${extraClass}" style="--i:${idx || 0}" onclick="${clickFn}">
    <div class="process-card__name">
      <span class="process-card__status-dot ${dotClass}"></span>
      ${safeName}
      <span class="process-card__status-label">${p.status}</span>
    </div>
    ${isHistory ? `<div class="history-card__date">${dateStr}</div>` : ''}
    <div class="process-card__meta">${epochStr}${safeCmd ? ' · ' + safeCmd : ''}</div>
    ${p.max_epoch ? `<div class="progress-track"><div class="progress-track__bar" style="width:${pct}%"></div></div>` : ''}
    <div class="process-card__stats">
      ${m.loss !== undefined ? `<span><span class="stat-item__value">${typeof m.loss === 'number' ? m.loss.toFixed(4) : m.loss}</span><span class="stat-item__label">loss</span></span>` : ''}
      ${m.val_acc !== undefined ? `<span><span class="stat-item__value">${typeof m.val_acc === 'number' ? (m.val_acc * 100).toFixed(1) + '%' : m.val_acc}</span><span class="stat-item__label">acc</span></span>` : ''}
      ${m.lr !== undefined ? `<span><span class="stat-item__value">${m.lr}</span><span class="stat-item__label">lr</span></span>` : ''}
      ${g.util_pct !== undefined ? `<span><span class="stat-item__value">${g.util_pct}%</span><span class="stat-item__label">GPU</span></span>` : ''}
      ${p.anomaly_count > 0 ? `<span class="process-card__anomaly">${p.anomaly_count} events</span>` : ''}
    </div>
    ${!isHistory ? `<div class="process-card__actions" onclick="event.stopPropagation()">
      <label class="btn btn--sm" style="cursor:pointer"><input type="checkbox" ${checked} onchange="toggleCompare('${p.process_id}', this.checked)" style="margin-right:4px;accent-color:var(--color-accent-fg)">对比</label>
    </div>` : ''}
  </div>`;
}

function toggleCompare(pid, on) {
  if (on) { if (compareSet.size >= 5) { alert('最多对比5个'); return; } compareSet.add(pid); }
  else compareSet.delete(pid);
  updateCompareBar();
}
function updateCompareBar() {
  const bar = document.getElementById('compare-bar');
  if (compareSet.size >= 2) { bar.classList.add('active'); } else { bar.classList.remove('active'); }
  document.getElementById('compare-count').textContent = compareSet.size;
}
function clearCompare() { compareSet.clear(); refreshProcesses(); }

async function runCompare() {
  const ids = [...compareSet];
  let data;
  try {
    data = await fetch('/api/compare', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ process_ids: ids }) }).then(r => r.json());
  } catch (e) { console.warn('[compare] fetch failed:', e); return; }
  if (!data) return;
  document.getElementById('view-process-list').classList.remove('active');
  document.getElementById('view-process-detail').classList.remove('active');
  document.getElementById('view-compare').classList.add('active');
  document.getElementById('compare-content').innerHTML = `<div class="compare-grid">${
    (data.comparisons || []).map(c => `<div class="card">
      <div class="card__title">${c.name}</div>
      <div style="font-size:13px;margin-bottom:8px">状态: ${c.status}</div>

    </div>`).join('')
  }</div>`;

async function showHistoryDetail(pid) {

  isHistoryProcess = true;

  document.getElementById('view-process-detail').classList.add('active');

  } else {

      extra += `<div style="font-size:12px;color:var(--color-text-tertiary);margin-top:2px">Anomalies: ${data.anomaly_count}</div>`;

  document.getElementById('model-tree').innerHTML = '<div class="skeleton-line skeleton-line--long"></div><div class="skeleton-line skeleton-line--medium"></div><div class="skeleton-line skeleton-line--short"></div>';

    <div style="font-size:12px;color:var(--color-text-tertiary);margin-top:4px">${escapeHtml(data.command || '')} · ${data.metrics_count || 0} records</div>`;

  // Metric cards
  const m = data.latest_metrics || {};
  const g = data.latest_gpu || {};
  document.getElementById('detail-metrics').innerHTML = [
    m.loss !== undefined ? { v: typeof m.loss === 'number' ? m.loss.toFixed(4) : m.loss, l: 'Loss', t: 'down', c: 'loss' } : null,
    m.val_acc !== undefined ? { v: typeof m.val_acc === 'number' ? (m.val_acc * 100).toFixed(1) + '%' : m.val_acc, l: 'Val Acc', t: 'up', c: 'acc' } : null,
    m.lr !== undefined ? { v: m.lr, l: 'LR', c: 'lr' } : null,
    g.util_pct !== undefined ? { v: g.util_pct + '%', l: 'GPU Util', c: 'gpu' } : null,
    { v: data.metrics_count || 0, l: 'Records', c: 'info' },
    { v: data.anomaly_count || 0, l: 'Anomalies', t: data.anomaly_count > 0 ? 'warn' : '', c: 'info' },
  ].filter(Boolean).map(c => {
    let trendHtml = '';
    if (c.t === 'down') trendHtml = '<div class="metric-card__trend metric-card__trend--down">&darr;</div>';
    else if (c.t === 'up') trendHtml = '<div class="metric-card__trend metric-card__trend--up">&uarr;</div>';
    else if (c.t === 'warn') trendHtml = '<div class="metric-card__trend metric-card__trend--warn">!</div>';
    return `<div class="metric-card metric-card--${c.c}"><div class="metric-card__value">${c.v}</div><div class="metric-card__label">${c.l}</div>${trendHtml}</div>`;
  }).join('');

  // Metric toggles
  const disc = data.discovered_metrics || {};
  let toggles = '';
  for (const [cat, keys] of Object.entries(disc)) {
    for (const k of (keys || []).slice(0, 8)) {

    }
  }
  document.getElementById('metric-toggles').innerHTML = toggles || '<span style="font-size:11px;color:var(--color-text-tertiary)">自动检测中...</span>';
}

function updateCursorInfo(u) {
  const idx = u.cursor.idx;
  const tooltip = document.getElementById('cursor-tooltip');
  const el = document.getElementById('cursor-info');
  const hint = document.getElementById('cursor-hint');

  if (idx == null || idx < 0) {
    // Mouse left chart area — hide tooltip
    if (tooltip) tooltip.classList.remove('visible');
    return;
  }
  if (!el) return;
  if (hint) hint.textContent = '';

  // Collect data from all chart instances at this index
  let items = [];
  chartInstances.forEach(c => {
    if (!c.data || !c.series) return;
    const xVal = c.data[0]?.[idx];
    for (let si = 1; si < c.series.length; si++) {
      const s = c.series[si];
      const val = c.data[si]?.[idx];
      items.push({
        key: s.label || ('series_' + si),
        val: val,
        color: s.stroke || '#888',
      });
    }
    if (items.length > 0 && xVal != null) {
      items[0].xVal = xVal;
    }
  });

  if (!items.length) {
    el.innerHTML = '<div class="cursor-info__val cursor-info__val--empty">无数据</div>';
    if (tooltip) tooltip.classList.remove('visible');
    return;
  }

  const xVal = items.find(i => i.xVal != null)?.xVal ?? idx;

  // Build shared HTML content
  let html = `<div class="cursor-info__step">Step ${xVal}</div><div class="cursor-info__grid">`;
  let tooltipHtml = `<div class="cursor-tooltip__step">Step ${xVal}</div>`;
  items.forEach(item => {
    const formatted = item.val != null ? formatValue(item.key, item.val) : '-';
    const cls = item.val != null ? '' : ' cursor-info__val--empty';
    // Panel (right side)
    html += `<div class="cursor-info__item">
      <span class="cursor-info__key"><span class="cursor-info__dot" style="background:${item.color}"></span>${escapeHtml(item.key)}</span>
      <span class="cursor-info__val${cls}">${formatted}</span>
    </div>`;
    // Floating tooltip
    tooltipHtml += `<div class="cursor-tooltip__row">
      <span class="cursor-tooltip__key"><span class="cursor-info__dot" style="background:${item.color}"></span>${escapeHtml(item.key)}</span>
      <span class="cursor-tooltip__val">${formatted}</span>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;

  // Update floating tooltip content and position
  if (tooltip) {
    tooltip.innerHTML = tooltipHtml;
    tooltip.classList.add('visible');

    // Get cursor position in viewport
    const overEl = u.over;
    const rect = overEl.getBoundingClientRect();
    const mouseX = rect.left + (u.cursor.left || 0);
    const mouseY = rect.top + (u.cursor.top || 0);

    // Position: offset to the right and slightly below cursor
    let left = mouseX + 16;
    let top = mouseY - 10;

    // Prevent overflow right
    const tooltipRect = tooltip.getBoundingClientRect();
    if (left + tooltipRect.width > window.innerWidth - 8) {
      left = mouseX - tooltipRect.width - 16;
    }
    // Prevent overflow bottom
    if (top + tooltipRect.height > window.innerHeight - 8) {
      top = window.innerHeight - tooltipRect.height - 8;
    }
    if (top < 8) top = 8;

    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }
}

function _dedupeMetrics(arr) {
  // Remove duplicate records with the same step/epoch value
  if (!arr.length) return arr;
  const seen = new Map();
  for (const m of arr) {
    const key = m.step !== undefined ? m.step : (m.epoch !== undefined ? m.epoch : seen.size);
    if (!seen.has(key)) seen.set(key, m);
  }
  return [...seen.values()];
}

function _isNumeric(metrics, key) {
  for (const m of metrics.slice(-10)) if (typeof m[key] === 'number') return true;
  return false;
}

function assignAxis(key) {
  const k = key.toLowerCase();
  if (k.includes('loss') || k.includes('error')) return 1;
  if (k.includes('acc') || k.includes('precision') || k.includes('recall') || k.includes('f1')) return 2;
  if (k.includes('lr') || k.includes('learning_rate')) return 3;
  return 1;
}

function formatValue(key, v) {
  if (v == null) return '';
  const k = key.toLowerCase();
  if (k.includes('acc') || k.includes('precision') || k.includes('recall') || k.includes('f1')) return (v * 100).toFixed(1) + '%';
  if (k.includes('lr') || k.includes('learning_rate')) return v.toExponential(1);
  if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  if (Math.abs(v) < 0.01 && v !== 0) return v.toExponential(2);
  return v.toFixed(4);
}

function detectAnomalies(metrics) {
  const events = [];
  if (!metrics.length) return events;
  const windowSize = 10;
  for (let i = windowSize; i < metrics.length; i++) {
    const m = metrics[i];
    // Loss Spike: current loss > 1.5x rolling average
    const lossKeys = Object.keys(m).filter(k => k.toLowerCase().includes('loss'));
    for (const lk of lossKeys) {
      const curr = m[lk];
      if (typeof curr !== 'number') continue;
      const win = metrics.slice(i - windowSize, i).map(w => w[lk]).filter(v => typeof v === 'number');
      if (!win.length) continue;
      const avg = win.reduce((a, b) => a + b, 0) / win.length;
      if (curr > avg * 1.5 && avg > 0) {
        events.push({ idx: i, type: 'spike', label: 'Loss Spike', color: '#f87171' });
        break;
      }
    }
    // LR Change: significant step-change (>30%) — avoids noise from cosine/warmup schedules
    const lrKeys = Object.keys(m).filter(k => k.toLowerCase().includes('lr') || k.toLowerCase().includes('learning_rate'));
    for (const lk of lrKeys) {
      const curr = m[lk];
      const prev = metrics[i - 1]?.[lk];
      if (typeof curr !== 'number' || typeof prev !== 'number') continue;
      if (curr !== prev && Math.abs(curr - prev) / Math.max(Math.abs(prev), 1e-10) > 0.30) {
        events.push({ idx: i, type: 'lr_change', label: 'LR Change', color: '#06b6d4' });
        break;
      }
    }
    // Checkpoint: epoch crosses an integer multiple of cpEvery (default 5)
    if (typeof m.epoch === 'number' && i > 0) {
      const cpEvery = window._cpEvery || 5;
      const prevEpoch = metrics[i - 1]?.epoch;
      if (typeof prevEpoch === 'number' && m.epoch > prevEpoch) {
        const currFloor = Math.floor(m.epoch);
        const prevFloor = Math.floor(prevEpoch);
        // Fired when epoch just crossed an integer boundary that is a multiple of cpEvery
        if (currFloor > prevFloor && currFloor % cpEvery === 0) {
          events.push({ idx: i, type: 'checkpoint', label: `Checkpoint (epoch ${currFloor})`, color: '#34d399' });
        }
      }
    }
  }
  return events;
}

function getCheckedKeys() {
  const metrics = window._allMetrics || [];
  if (!metrics.length) return [];
  const cbs = document.querySelectorAll('.metric-cb:checked');
  let keys = [...cbs].map(c => c.dataset.key).filter(k => _isNumeric(metrics, k));
  if (!keys.length) keys.push(...Object.keys(metrics[0]).filter(k => _isNumeric(metrics, k)).slice(0, 4));
  return keys;
}

function downsampleLTTB(data, threshold) {
  if (data.length <= threshold) return data;
  const sampled = [data[0]];
  const every = (data.length - 2) / (threshold - 2);
  let a = 0;
  for (let i = 0; i < threshold - 2; i++) {
    let avgX = 0, avgY = 0, count = 0;
    const start = Math.floor((i + 1) * every) + 1;
    const end = Math.min(Math.floor((i + 2) * every) + 1, data.length);
    for (let j = start; j < end; j++) { avgX += j; avgY += (data[j] ?? 0); count++; }
    avgX /= count; avgY /= count;
    const rangeStart = Math.floor(i * every) + 1;
    const rangeEnd = Math.floor((i + 1) * every) + 1;
    let maxArea = -1, maxIdx = rangeStart;
    for (let j = rangeStart; j < rangeEnd; j++) {
      const area = Math.abs((j - a) * (avgY - (data[a] ?? 0)) - (avgX - a) * ((data[j] ?? 0) - (data[a] ?? 0))) * 0.5;
      if (area > maxArea) { maxArea = area; maxIdx = j; }
    }
    sampled.push(data[maxIdx]);
    a = maxIdx;
  }
  sampled.push(data[data.length - 1]);
  return sampled;
}

function computeEMA(data, alpha = 0.1) {
  const ema = [data[0]];
  for (let i = 1; i < data.length; i++) {
    ema.push(alpha * (data[i] ?? ema[i-1]) + (1 - alpha) * ema[i-1]);
  }
  return ema;
}

function initCharts() {
  const keys = getCheckedKeys();
  const panelsEl = document.getElementById('chart-panels');

  if (!keys.length) {
    chartInstances.forEach(c => { if (c) c.destroy(); });
    chartInstances = [];
    panelsEl.innerHTML = '<div class="empty-state">暂无数值型指标数据<br><span class="empty-state__hint">等待训练推送指标或检查 checkbox 选择</span></div>';
    updateEventLegend([]);
    return;
  }

  // Destroy all existing charts
  chartInstances.forEach(c => { if (c) c.destroy(); });
  chartInstances = [];

  // Preserve expanded state across rebuilds
  const prevExpanded = panelsEl.querySelector('.chart-wrapper.expanded')?.getAttribute('data-group') || null;
  panelsEl.innerHTML = '';

  const metrics = window._allMetrics || [];
  if (!metrics.length) return;

  // Group keys by type
  const groups = {};
  keys.forEach(k => {
    const g = assignGroup(k);
    if (!groups[g]) groups[g] = [];
    groups[g].push(k);
  });

  const maxPoints = 2000;
  const xs = metrics.map((m, i) => i);
  const downsampled = xs.length > maxPoints;
  const xData = downsampled ? downsampleLTTB(xs, maxPoints) : xs;

  // Create one chart per group
  const groupOrder = ['loss', 'accuracy', 'lr', 'gpu', 'custom'];
  const sortedGroups = Object.keys(groups).sort((a, b) => {
    const ai = groupOrder.indexOf(a) >= 0 ? groupOrder.indexOf(a) : 99;
    const bi = groupOrder.indexOf(b) >= 0 ? groupOrder.indexOf(b) : 99;
    return ai - bi;
  });

  const containers = [];
  const gridEl = document.createElement('div');
  gridEl.className = 'charts-grid';
  panelsEl.appendChild(gridEl);

  sortedGroups.forEach(groupName => {
    const groupKeys = groups[groupName];
    // Create wrapper
    const wrapper = document.createElement('div');
    wrapper.className = 'chart-wrapper';
    wrapper.setAttribute('data-group', groupName);
    wrapper.onclick = function() { toggleChartExpand(this); };
    gridEl.appendChild(wrapper);

    const titleEl = document.createElement('div');
    titleEl.className = 'chart-group-title';
    titleEl.textContent = groupName.toUpperCase();
    wrapper.appendChild(titleEl);

    const chartEl = document.createElement('div');
    chartEl.className = 'chart-container';
    chartEl.id = 'chart-group-' + groupName;
    wrapper.appendChild(chartEl);
    containers.push({ groupName, groupKeys, chartEl });
  });

  // Restore expanded state
  if (prevExpanded) {
    const w = gridEl.querySelector(`[data-group="${prevExpanded}"]`);
    if (w) { w.classList.add('expanded'); gridEl.classList.add('has-expanded'); }
  }

  // Force layout reflow so all containers have correct dimensions
  panelsEl.offsetHeight;

  containers.forEach(({ groupName, groupKeys, chartEl }) => {

    // Build series
    const uSeries = [{ label: 'Step', scale: 'x' }];
    const seriesData = [xData];
    groupKeys.forEach((k, ki) => {
      let rawData = metrics.map(m => m[k] ?? null);
      let data = downsampled ? downsampleLTTB(rawData, maxPoints) : rawData;
      const color = THEME.palette[(ki + sortedGroups.indexOf(groupName) * 3) % THEME.palette.length];
      seriesData.push(data);
      uSeries.push({
        label: k,
        stroke: color,
        width: 2,
        spanGaps: true,
        points: { show: false },
      });
      // EMA overlay (only for loss/accuracy — smoothing lr/gpu/custom is meaningless)
      const allowEMA = smoothingEnabled && ['loss', 'accuracy'].includes(groupName);
      if (allowEMA && data.filter(v => v != null).length > 10) {
        const ema = computeEMA(data);
        seriesData.push(ema);
        uSeries.push({
          label: k + ' (EMA)',
          stroke: color + '80',
          width: 1,
          dash: [4, 4],
          spanGaps: true,
          points: { show: false },
        });
      }
    });

    // Y-axis config per group
    let yScale = {};
    let yAxes = [];
    if (groupName === 'loss') {
      yScale = { range: (u, min, max) => [min * 0.95, max * 1.05] };
      yAxes = [{ label: 'Loss', values: (u, ticks) => ticks.map(v => formatValue('loss', v)), grid: { stroke: THEME.grid } }];
    } else if (groupName === 'accuracy') {
      yScale = { range: [0, 1] };
      yAxes = [{ label: 'Accuracy', values: (u, ticks) => ticks.map(v => (v * 100).toFixed(0) + '%'), grid: { stroke: THEME.grid } }];
    } else if (groupName === 'lr') {
      // Check if LR values are all constant (uPlot bug: log scale breaks with constant values)
      const lrVals = groupKeys.length > 0 ? metrics.map(m => m[groupKeys[0]]).filter(v => v != null && typeof v === 'number') : [];
      const allSame = lrVals.length > 0 && lrVals.every(v => v === lrVals[0]);
      if (allSame) {
        // Use linear scale with padding for constant LR values
        const val = lrVals[0] || 0.001;
        yScale = { range: [val * 0.1, val * 10] };
        yAxes = [{ label: 'LR', values: (u, ticks) => ticks.map(v => v.toExponential(1)), grid: { stroke: THEME.grid } }];
      } else {
        yScale = {
          distr: 3,
          range: (u, min, max) => {
            if (min <= 0) min = 1e-7;
            if (max <= 0) max = 1;
            if (min === max) { return [min / 10, max * 10]; }
            return [min * 0.5, max * 2];
          },
        };
        yAxes = [{ label: 'LR', values: (u, ticks) => ticks.map(v => v.toExponential(1)), grid: { stroke: THEME.grid } }];
      }
    } else {
      yScale = { range: (u, min, max) => { const pad = (max - min) * 0.1 || 0.1; return [min - pad, max + pad]; } };
      yAxes = [{ label: groupName, grid: { stroke: THEME.grid } }];
    }

    // Events plugin (only on first chart)
    const plugins = [];
    if (sortedGroups.indexOf(groupName) === 0 && chartEvents.length) {
      plugins.push({
        hooks: {
          drawSeries: (u, seriesIdx) => {
            if (seriesIdx !== 1) return;
            const ctx = u.ctx;
            chartEvents.forEach(ev => {
              if (ev.idx >= u.data[0].length) return;
              const x = u.valToPos(ev.idx, 'x');
              ctx.save();
              ctx.strokeStyle = ev.color;
              ctx.lineWidth = 1;
              ctx.setLineDash([4, 4]);
              ctx.beginPath();
              ctx.moveTo(x, u.bbox.top);
              ctx.lineTo(x, u.bbox.top + u.bbox.height);
              ctx.stroke();
              ctx.setLineDash([]);
              ctx.fillStyle = ev.color;
              ctx.beginPath();
              ctx.moveTo(x, u.bbox.top + 8);
              ctx.lineTo(x - 5, u.bbox.top + 16);
              ctx.lineTo(x + 5, u.bbox.top + 16);
              ctx.fill();
              ctx.restore();
            });
          }
        }
      });
    }

    const opts = {
      width: chartEl.clientWidth || panelsEl.clientWidth || 800,
      height: chartEl.clientHeight || 300,
      cursor: {
        drag: { x: true, y: false, setScale: true },
        sync: { key: 'train-sync' },
      },
      legend: { show: false },
      scales: {
        x: { time: false },
        y: yScale,
      },
      axes: [
        { stroke: THEME.text, grid: { stroke: THEME.grid }, ticks: { stroke: THEME.border } },
        { stroke: THEME.text, ...yAxes[0] },
      ],
      plugins: plugins,
      series: uSeries,
      hooks: {
        setCursor: [function(u) {
          updateCursorInfo(u);
        }],
      },
    };

    const chartWidth = chartEl.clientWidth || panelsEl.clientWidth || 800;
    const chart = new uPlot(opts, seriesData, chartEl);
    chartInstances.push(chart);
    chart._groupName = groupName;
    chart._keys = groupKeys;
  });

  // Final resize pass
  requestAnimationFrame(_resizeCharts);

  // Update event legend
  updateEventLegend(chartEvents);

  // Update range slider
  const total = metrics.length;
  const minSlider = document.getElementById('chart-range-min');
  const maxSlider = document.getElementById('chart-range-max');
  minSlider.max = total - 1;
  maxSlider.max = total - 1;
  minSlider.value = 0;
  maxSlider.value = total - 1;
  document.getElementById('range-start').textContent = '0';
  document.getElementById('range-end').textContent = total - 1;
}

function updateEventLegend(events) {
  const el = document.getElementById('event-legend');
  if (!el) return;
  const types = new Map();
  (events || []).forEach(e => { if (!types.has(e.type)) types.set(e.type, e); });
  if (types.size === 0) {
    el.innerHTML = '<span class="event-legend__item" style="color:var(--color-text-tertiary)">未检测到异常事件</span>';
  } else {
    el.innerHTML = [...types.values()].map(e =>
      `<span class="event-legend__item"><span class="event-legend__dot" style="background:${e.color}"></span>${e.label}</span>`
    ).join('');
  }
}

function toggleChartExpand(wrapper) {
  const grid = wrapper.closest('.charts-grid');
  const wasExpanded = wrapper.classList.contains('expanded');
  // Collapse all
  grid.querySelectorAll('.chart-wrapper.expanded').forEach(w => w.classList.remove('expanded'));
  grid.classList.remove('has-expanded');
  // Toggle current
  if (!wasExpanded) {
    wrapper.classList.add('expanded');
    grid.classList.add('has-expanded');
  }
  // Resize charts after CSS transition
  setTimeout(_resizeCharts, 50);
  setTimeout(_resizeCharts, 350);
}

function assignGroup(key) {
  const k = key.toLowerCase();
  if (k.includes('loss') || k.includes('error')) return 'loss';
  if (k.includes('acc') || k.includes('precision') || k.includes('recall') || k.includes('f1') || k.includes('map') || k.includes('miou')) return 'accuracy';
  if (k.includes('lr') || k.includes('learning_rate')) return 'lr';
  if (k.includes('gpu') || k.includes('mem_used') || k.includes('util_pct') || k.includes('temp')) return 'gpu';
  return 'custom';
}

function updateChart() {
  initCharts();  // Rebuild all charts with latest data
}

function onRangeChange() {
  const metrics = window._allMetrics || [];
  const total = metrics.length;
  if (!total) return;
  const minVal = parseInt(document.getElementById('chart-range-min').value);
  const maxVal = parseInt(document.getElementById('chart-range-max').value);
  const lo = Math.min(minVal, maxVal);
  const hi = Math.max(minVal, maxVal);
  document.getElementById('range-start').textContent = lo;
  document.getElementById('range-end').textContent = hi;
  chartInstances.forEach(c => c.setScale('x', { min: lo, max: hi }));
}

async function loadDashboardConfig(pid) {
  if (isHistoryProcess) {
    // History processes don't have live config; use defaults
    _dashConfig = { template: "training", charts: { default_groups: ["loss", "accuracy"], smoothing: false, range_mode: "auto" }, panels: { cursor_info: true, logs: true, ai_chat: false } };
    return;
  }
  try {
    const data = await api(`/api/process/${pid}/dashboard-config`, 5000);
    if (data && !data.error) {
      _dashConfig = data;
    }
  } catch (e) {
    // Dashboard config not available, use defaults
  }
  if (!_dashConfig) {
    _dashConfig = { template: "training", charts: { default_groups: ["loss", "accuracy"], smoothing: false, range_mode: "auto" }, panels: { cursor_info: true, logs: true, ai_chat: false } };
  }
}

function applyRemoteDashConfig(data, source) {
  if (!data || source === "user") return; // User-initiated changes already applied locally
  _dashConfig = data;

  // Apply chart groups — only for non-dirty items
  if (data.charts && data.charts.default_groups) {
    if (!_dashDirty.has("chart_groups")) {
      // Update checkboxes to match remote config
      const allKeys = getCheckedKeys();
      const remoteKeys = new Set(data.charts.default_groups);
      document.querySelectorAll('.metric-toggle').forEach(cb => {
        const key = cb.dataset.key;
        const group = assignGroup(key);
        cb.checked = remoteKeys.has(group);
      });
      initCharts();
    }
  }

  // Apply smoothing — only if not dirty
  if (data.charts && typeof data.charts.smoothing === "boolean") {
    if (!_dashDirty.has("smoothing")) {
      smoothingEnabled = data.charts.smoothing;
      document.getElementById('btn-ema').classList.toggle('btn--active', smoothingEnabled);
      if (chartInstances.length) initCharts();
    }
  }

  // Apply panel visibility — only for non-dirty items
  if (data.panels) {
    if (!_dashDirty.has("panels")) {
      const cursorPanel = document.querySelector('.panel .cursor-info')?.closest('.panel');
      if (cursorPanel) cursorPanel.style.display = data.panels.cursor_info !== false ? '' : 'none';
    }
  }
}

function markDashDirty(key) {
  _dashDirty.add(key);
}

function resetZoom() {
  const metrics = window._allMetrics || [];
  const total = metrics.length;
  if (!total) return;
  const maxIdx = total - 1;
  document.getElementById('chart-range-min').value = 0;
  document.getElementById('chart-range-max').value = maxIdx;
  document.getElementById('range-start').textContent = '0';
  document.getElementById('range-end').textContent = maxIdx;
  chartInstances.forEach(c => c.setScale('x', { min: 0, max: maxIdx }));
  // Clear all dirty flags — user explicitly reset, accept remote config
  _dashDirty.clear();
  // Re-apply remote config defaults
  if (_dashConfig) applyRemoteDashConfig(_dashConfig, "reset");
}

function toggleSmoothing() {
  smoothingEnabled = !smoothingEnabled;
  markDashDirty('smoothing');
  document.getElementById('btn-ema').classList.toggle('btn--active', smoothingEnabled);
  initCharts();
}

function exportCSV() {
  const metrics = window._allMetrics || [];
  if (!metrics.length) return alert('没有数据可导出');
  const keys = Object.keys(metrics[0]).filter(k => k !== 'timestamp');
  const header = 'step,' + keys.join(',');
  const rows = metrics.map((m, i) => {
    return [i, ...keys.map(k => m[k] ?? '')].join(',');
  });
  const csv = header + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `training_metrics_${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function exportPNG() {

  const expanded = document.querySelector('.chart-wrapper.expanded .chart-container');

function liveUpdateMetrics(m) {
  if (!window._allMetrics) window._allMetrics = [];
  window._allMetrics.push(m);
  if (window._allMetrics.length > 2000) window._allMetrics = window._allMetrics.slice(-2000);
  // Detect new anomalies
  const metrics = window._allMetrics;
  const lastIdx = metrics.length - 1;
  if (lastIdx >= 10) {
    const lossKeys = Object.keys(m).filter(k => k.toLowerCase().includes('loss'));
    for (const lk of lossKeys) {
      const curr = m[lk];
      if (typeof curr !== 'number') continue;
      const win = metrics.slice(lastIdx - 10, lastIdx).map(w => w[lk]).filter(v => typeof v === 'number');
      if (!win.length) continue;
      const avg = win.reduce((a, b) => a + b, 0) / win.length;
      if (curr > avg * 1.5 && avg > 0) {
        chartEvents.push({ idx: lastIdx, type: 'spike', label: 'Loss Spike', color: '#f87171' });
        break;
      }
    }
  }
  // Incremental update: append data to existing charts instead of full rebuild
  if (chartInstances.length) {
    _appendLiveData(m);
  } else {
    initCharts();
  }
}

function _appendLiveData(m) {
  const metrics = window._allMetrics;
  const xIdx = metrics.length - 1;
  const alpha = 0.1;
  chartInstances.forEach(c => {
    const oldData = c.data;
    if (!oldData || !oldData.length) return;
    const series = c.series;
    const newData = oldData.map((arr, si) => {
      if (si === 0) return [...arr, xIdx]; // x-axis
      const label = series[si]?.label || '';
      const isEMA = label.endsWith(' (EMA)');
      const key = isEMA ? label.replace(' (EMA)', '') : label;
      const val = typeof m[key] === 'number' ? m[key] : null;
      if (isEMA) {
        const prevEma = arr[arr.length - 1];
        const emaVal = val != null
          ? (prevEma != null ? alpha * val + (1 - alpha) * prevEma : val)
          : prevEma;
        return [...arr, emaVal];
      }
      return [...arr, val];
    });
    c.setData(newData);
  });
  // Update range slider max
  const total = metrics.length;
  const maxSlider = document.getElementById('chart-range-max');
  if (maxSlider && total > 1) {
    maxSlider.max = total - 1;
    document.getElementById('range-end').textContent = total - 1;
  }
}

// ===================== AI =====================
async function runAIAnalysis() {
  if (!currentProcessId) {
    document.getElementById('ai-output').textContent = '请先选择一个进程';
    return;
  }
  const btn = document.getElementById('btn-ai-analyze');
  const output = document.getElementById('ai-output');
  btn.disabled = true;
  btn.textContent = '分析中...';
  output.textContent = '正在调用 AI 分析，请稍候...';
  try {
    const prefix = isHistoryProcess ? '/api/history' : '/api/process';
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);
    const r = await fetch(`${prefix}/${currentProcessId}/ai/analyze`, {
      method: 'POST',
      signal: controller.signal
    });
    clearTimeout(timeout);
    if (!r.ok) {
      const errBody = await r.text().catch(() => '');
      throw new Error(`HTTP ${r.status}: ${errBody.slice(0, 100)}`);
    }
    const d = await r.json();
    output.textContent = d.analysis || 'AI 无响应';
    if (d.source) output.textContent += `\n\n[来源: ${d.source}]`;
  } catch (e) {
    if (e.name === 'AbortError') {
      output.textContent = 'AI 分析超时（30秒），请检查网络连接或凭据配置';
    } else {
      output.textContent = '分析失败: ' + e.message;
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '分析';
  }
}

async function askAI() {
  const q = document.getElementById('ai-question').value.trim();
  if (!q) return;
  if (!currentProcessId) {
    document.getElementById('ai-output').textContent += '\n\n请先选择一个进程';
    return;
  }
  const output = document.getElementById('ai-output');
  output.textContent += '\n\nQ: ' + q + '\n思考中...';
  const input = document.getElementById('ai-question');
  input.disabled = true;
  try {
    const prefix = isHistoryProcess ? '/api/history' : '/api/process';
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);
    const r = await fetch(`${prefix}/${currentProcessId}/ai/chat?question=${encodeURIComponent(q)}`, {
      method: 'POST',
      signal: controller.signal
    });
    clearTimeout(timeout);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const answer = d.answer || d.analysis || '无响应';
    output.textContent = output.textContent.replace('思考中...', 'A: ' + answer);
  } catch (e) {
    if (e.name === 'AbortError') {
      output.textContent = output.textContent.replace('思考中...', '超时，请重试');
    } else {
      output.textContent = output.textContent.replace('思考中...', '错误: ' + e.message);
    }
  } finally {
    input.disabled = false;
    input.value = '';
    input.focus();
  }
}

function _nodeTypeBadge(type) {
  const t = (type || '').toLowerCase();
  let cls = 'default';
  if (t.includes('conv')) cls = 'conv';
  else if (t.includes('linear') || t.includes('mlp') || t.includes('attention')) cls = 'linear';
  else if (t.includes('norm') || t.includes('layernorm') || t.includes('batchnorm')) cls = 'norm';
  else if (t.includes('pool') || t.includes('avg') || t.includes('max')) cls = 'pool';
  else if (t.includes('relu') || t.includes('sigmoid') || t.includes('softmax') || t.includes('gelu') || t.includes('act')) cls = 'act';
  else if (t.includes('drop')) cls = 'drop';
  else if (t.includes('embed')) cls = 'embed';
  return `<span class="node-type-badge node-type-badge--${cls}">${escapeHtml(type || '?')}</span>`;
}

function renderTreeNodes(nodes, totalP, totalF, depth) {
  if (!nodes || !nodes.length) return '';
  const autoCollapseDepth = 2;
  return nodes.map(n => {
    const pct = totalP > 0 ? (n.params || 0) / totalP * 100 : 0;
    const barColor = pct > 25 ? 'var(--color-danger-fg)' : pct > 5 ? 'var(--color-accent-fg)' : 'var(--color-success-fg)';
    const hasChildren = n.children && n.children.length > 0;
    const shortName = escapeHtml(n.name.split('.').pop());
    const fullName = escapeHtml(n.name);
    const repeat = n.repeat > 1 ? `<span class="node-repeat-badge">\u00d7${n.repeat}</span>` : '';
    const params = n.params ? `<span class="node-params-badge">${fmtParams(n.params)}</span>` : '';
    const flops = n.flops ? `<span class="node-flops-badge">${fmtParams(n.flops)} FLOPs</span>` : '';
    const bar = pct > 0.1 ? `<span class="node-bar-track"><span class="node-bar-fill" style="width:${Math.min(pct, 100)}%;background:${barColor}"></span></span>` : '';

    const toggleHtml = hasChildren
      ? `<span class="tree-toggle" onclick="event.stopPropagation();toggleTreeNode(this)">${depth < autoCollapseDepth ? '\u25BE' : '\u25B8'}</span>`
      : '<span class="tree-spacer"></span>';

    const childrenHtml = hasChildren
      ? `<ul class="tree-children${depth >= autoCollapseDepth ? ' collapsed' : ''}">${renderTreeNodes(n.children, totalP, totalF, depth + 1)}</ul>`
      : '';

    return `<li>
      <div class="tree-node" title="${fullName}">
        ${toggleHtml}
        ${_nodeTypeBadge(n.type)}
        <span class="node-name">${shortName}</span>
        ${repeat}${params}${flops}${bar}
      </div>
      ${childrenHtml}
    </li>`;
  }).join('');
}

function toggleTreeNode(el) {
  const li = el.closest('li');
  const children = li.querySelector('.tree-children');
  if (!children) return;
  const isCollapsed = children.classList.contains('collapsed');
  if (isCollapsed) {
    children.classList.remove('collapsed');
    children.style.maxHeight = children.scrollHeight + 2000 + 'px';
    el.textContent = '\u25BE';
    setTimeout(() => { children.style.maxHeight = 'none'; }, 350);
  } else {
    children.style.maxHeight = children.scrollHeight + 'px';
    requestAnimationFrame(() => {
      children.classList.add('collapsed');
      children.style.maxHeight = '';
    });
    el.textContent = '\u25B8';
  }
}

function switchModelSubTab(tab) {
  document.getElementById('model-sub-tree').style.display = tab === 'tree' ? '' : 'none';
  document.getElementById('model-sub-viz').style.display = tab === 'viz' ? '' : 'none';
  document.getElementById('btn-model-tree').classList.toggle('model-sub-active', tab === 'tree');
  document.getElementById('btn-model-viz-tab').classList.toggle('model-sub-active', tab === 'viz');
}

function fmtParams(p) {
  if (!p) return '0';
  if (p >= 1e6) return (p / 1e6).toFixed(1) + 'M';
  if (p >= 1e3) return Math.round(p / 1e3) + 'K';
  return p.toString();
}

function showToast(msg, durationMs = 2000) {

  el.textContent = msg;
  el.classList.add('toast--show');
  setTimeout(() => el.classList.remove('toast--show'), durationMs);
}

function copyGuardianCmd() {
  const cmd = document.getElementById('new-command').value.trim();
  const fullCmd = `python run.py watch --with-dashboard -- ${cmd}`;
  navigator.clipboard.writeText(fullCmd).then(
    () => showToast('命令已复制到剪贴板'),
    () => showToast('复制失败，请手动复制: ' + fullCmd, 4000)
  );
}
</script>
